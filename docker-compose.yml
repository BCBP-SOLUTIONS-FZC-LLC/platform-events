# Local development stack for platform-events: floci (SNS/SQS emulator),
# floci-ui (web console) and Postgres (outbox / inbox). Start with
# `make docker-up`. The test suites don't use this — they start their own
# containers via testcontainers.
services:
  floci:
    # Floci — open-source (MIT), always-free AWS emulator; the platform's
    # drop-in LocalStack replacement (same as iam-org-membership). Every
    # service (SNS, SQS, Glue Schema Registry, …) is on :4566 with no
    # SERVICES selection or auth token. The -compat image bundles the AWS CLI
    # used by the healthcheck and scripts/init-floci.sh.
    image: floci/floci:2.1.0-compat@sha256:bb98b11f837bdacdda21ce6635a0773509e50aa471c35be9332a9efef502127c
    ports:
      # Host ports are unique across the org's local stacks so platform-events
      # runs side by side with every IAM service (4566–4573 / 4500–4504 /
      # 5432–5537 are taken by pgcommon and the iam-* repos). Override with
      # FLOCI_PORT / FLOCI_UI_PORT / POSTGRES_PORT if needed.
      - "${FLOCI_PORT:-4574}:4566"
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      # Rewrites the host in SQS QueueUrl / SNS responses to http://floci:4566
      # so floci-ui (which follows those URLs from inside its own container)
      # can reach them; otherwise its per-queue attributes, message counts
      # included, silently come back empty. Host-side clients are unaffected:
      # the AWS SDK sends every call to AWS_ENDPOINT_URL.
      FLOCI_HOSTNAME: floci
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "60"
    volumes:
      - floci_data:/app/data
      - ./scripts/init-floci.sh:/etc/floci/init/ready.d/init-floci.sh:ro
    healthcheck:
      # Checks the LAST resource init-floci.sh creates, not bare reachability,
      # so dependants start only once the topology exists. --region is
      # required: the compat image's CLI defaults to us-east-1 and floci
      # isolates resources per region.
      test: ["CMD", "aws", "--region", "us-east-1", "sqs", "get-queue-url", "--queue-name", "platform-events-demo-q"]
      interval: 5s
      timeout: 5s
      retries: 20

  floci-ui:
    # Web console for floci at http://localhost:4505 — browse SNS/SQS
    # resources and live queue message counts without the aws CLI (it does
    # not show message bodies; use `docker compose exec floci aws …` for that).
    image: floci/floci-ui:0.5.0@sha256:f3a2d38bbc306409bcada19efba092721216f315dcb27c2658551d7d29d5f9bb
    ports:
      - "${FLOCI_UI_PORT:-4505}:4500"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
      # floci-ui's own connectivity probe reads FLOCI_ENDPOINT, not
      # AWS_ENDPOINT_URL; unset, it probes localhost:4566 inside its own
      # container and always shows "Not connected".
      FLOCI_ENDPOINT: http://floci:4566
      PORT: "4500"
    depends_on:
      floci:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_events_dev
    ports:
      - "${POSTGRES_PORT:-5538}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_events_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  floci_data:
