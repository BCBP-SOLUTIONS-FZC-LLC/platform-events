# Pre-merge CHANGELOG check.
# Fails if a PR modifies internal/, pkg/, or cmd/ without also updating CHANGELOG.md.
# This catches missing entries before the release workflow, reducing friction at tag time.
name: Changelog check

"on":
  pull_request:
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'cmd/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: CHANGELOG updated in this PR
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated in this PR — OK."
          else
            echo "::error file=CHANGELOG.md,title=CHANGELOG not updated::This PR changes internal/, pkg/, or cmd/ but does not update CHANGELOG.md. Add an entry under the Unreleased section before merging."
            exit 1
          fi
