# Release for https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events
# Triggered by version tags (e.g. v1.5.0 or v1.5.0-rc.1).
#
# Same pipeline as ci.yml — same job names, same gates, same order — run at
# the tagged commit, with a release front (tag + CHANGELOG verification) and a
# release back (binaries, image push, GitHub Release):
#
#   verify ──┬─► validate-test ────┬──► interop ──────────────┐
#            │                     ├──► binaries ◄── quality ─┤
#            ├─► build-image ──────┼──► trivy ────────────────┤──► push ──► publish
#            │                     └──► smoke ────────────────┤
#            └─► validate-quality ────────────────────────────┘
#
# (trivy and smoke need validate-test + build-image, exactly as in ci.yml;
# binaries needs both validation gates; push needs everything.)
#
# Nothing is published until every gate has passed on the exact image that
# ships: build-image, trivy, smoke and push all build the same Dockerfile at
# the same commit with the same build args (BUILD_VERSION = the tag,
# SOURCE_DATE_EPOCH = the commit time), so push is a cache hit of the image
# that was scanned and smoke-tested — not a rebuild that could differ.
#
# Differences from ci.yml, all release-specific: the verify job; checkouts pin
# the tag; images are tagged X.Y.Z (plus X.Y / X / latest only when this tag
# is the highest stable version of that line) instead of branch / sha;
# provenance is mode=max and exported; the Cosign identity is release.yml at
# the run's ref (the tag, or main for a dispatch); binaries + publish replace
# pr-summary.
name: Release

"on":
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.5.0)'
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/platform-events
  BUILDKIT_PROGRESS: plain

jobs:
  # ── fail fast: a wrong tag or a missing CHANGELOG section stops everything
  verify:
    name: Verify tag + CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_date_epoch: ${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
      tag_latest: ${{ steps.tags.outputs.latest }}
      tag_major: ${{ steps.tags.outputs.major }}
      tag_minor: ${{ steps.tags.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      # Dispatch ref (main or the tag), HEAD == tag, tag reachable from
      # origin/main (fetch-depth 0 above provides origin/main and every tag) —
      # same gate as platform-pgcommon v1.4.1.
      - name: Verify release tag (dispatch ref, checkout, on main)
        run: bash .github/scripts/verify-release-tag.sh

      # Block the release if CHANGELOG.md has no entry for this tag.
      # Developers must update CHANGELOG.md before tagging.
      - name: Verify CHANGELOG entry exists
        run: bash .github/scripts/verify-changelog-entry.sh

      # One SOURCE_DATE_EPOCH for every image build below, so they are
      # byte-identical and push reuses the scanned image from cache.
      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      # Which floating tags (X.Y / X / latest) this release may move: only
      # forward, so a hotfix of an older line never re-points latest.
      - name: Select floating image tags
        id: tags
        run: bash .github/scripts/release-image-tags.sh

  # ── same as ci.yml ────────────────────────────────────────────────────────
  validate-test:
    name: Validate / Test
    needs: verify
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # ── same as ci.yml ────────────────────────────────────────────────────────
  validate-quality:
    name: Validate / Quality
    needs: verify
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # ── same as ci.yml: Hadolint first, then build into the cache ────────────
  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      # Cache targets (SOURCE_DATE_EPOCH comes from the verify job instead).
      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: 'true'
        run: bash .github/scripts/set-build-cache-targets.sh

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Always pull the base image for a release (digest-pinned, so this only
      # verifies the pinned digest is still resolvable).
      - name: Build image → cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          pull: true
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

  # ── same as ci.yml ────────────────────────────────────────────────────────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [verify, validate-test, build-image]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: platform-events-ci-test
          cache-from: type=gha
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Cache Trivy DB
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Table format: human-readable in CI logs; fails on CRITICAL/HIGH/UNKNOWN.
      # Scans both the OS layer and the Go binary's module + stdlib versions.
      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-events-ci-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      # SARIF format: uploads to GitHub Security tab.
      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-events-ci-test
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full component inventory for compliance / audit.
      # Attached to the GitHub Release by the publish job.
      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-events-ci-test
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.RELEASE_TAG }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── same as ci.yml ────────────────────────────────────────────────────────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [verify, validate-test, build-image]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: platform-events-ci-test
          cache-from: type=gha
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Smoke tests
        run: bash .github/scripts/smoke-tests.sh

  # ── same as ci.yml, against the tag ──────────────────────────────────────
  interop:
    name: Cross-language compatibility
    needs: validate-test
    uses: BCBP-SOLUTIONS-FZC-LLC/platform-interop-tests/.github/workflows/interop.yml@87107db3ca534faf15bd1d71d90baa498c3a7f0b # main @ 2026-08-18 — pinned: it receives a private token
    with:
      platform_events_ref: ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      gh_private_token: ${{ secrets.GH_PRIVATE_TOKEN || secrets.GO_PRIVATE_TOKEN }}

  # ── release-only: cross-compiled CLI binaries for the GitHub Release ─────
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/go.sum
            tools/go.sum

      # The cross-compile below needs the private platform-pgcommon module.
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      # linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64,
      # each with a .sha256 — also proves the library builds on every target.
      - name: Prepare release binaries (all platforms)
        run: bash .github/scripts/prepare-release-binary.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ env.RELEASE_TAG }}
          path: |
            platform-events_*
            release-asset.name
          if-no-files-found: error
          retention-days: 90

  # ── same as ci.yml's push, with release tags — only after every gate ──────
  push:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: [verify, validate-test, validate-quality, trivy, smoke, interop, binaries]
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.pushed.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # X.Y.Z always; X.Y, X and latest only when this tag is the highest
          # stable version of that line (release-image-tags.sh in verify).
          # latest=false: metadata-action's default (latest=auto) adds latest
          # to every stable semver tag, which would move it backwards on a
          # hotfix of an older line.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ needs.verify.outputs.tag_minor == 'true' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ needs.verify.outputs.tag_major == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.tag_latest == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Same Dockerfile, commit and build args as build-image/trivy/smoke →
      # a cache hit of the image that was scanned and smoke-tested.
      - name: Build and push
        id: pushed
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via Sigstore OIDC — no long-lived key to rotate or leak.
      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Export SLSA provenance
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
        run: bash .github/scripts/export-image-provenance.sh

      - name: Upload provenance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ env.RELEASE_TAG }}
          path: provenance.slsa.json
          retention-days: 90

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh

  # ── release-only: the GitHub Release consuming services see ──────────────
  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [push]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Extract release notes from CHANGELOG
        env:
          IMAGE_VERSION: ${{ needs.push.outputs.version }}
          IMAGE_DIGEST: ${{ needs.push.outputs.digest }}
        run: bash .github/scripts/extract-release-notes.sh

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ env.RELEASE_TAG }}

      - name: Download provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-${{ env.RELEASE_TAG }}

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ env.RELEASE_TAG }}
          path: .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.push.outputs.digest }}
        run: bash .github/scripts/create-github-release.sh
