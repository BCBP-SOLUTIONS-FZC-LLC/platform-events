# Reusable workflow — called by validate.yml's "Quality" job. Its job id ("quality")
# combines with the calling chain to produce the "Validate / Quality / quality" required
# status check.
# Runs: checkout → go mod download → verify → format check → tidy check → vet → lint → vuln-check
name: Quality Check

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    secrets:
      GO_PRIVATE_TOKEN:
        description: 'Token for downloading private BCBP-SOLUTIONS-FZC-LLC Go modules'
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Clean up credentials
        if: always()
        run: rm -f ~/.git-credentials

      - name: Verify modules
        run: go mod verify

      - name: Format check
        run: make fmt-check

      - name: Tidy check
        run: |
          make tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: make vuln-check
