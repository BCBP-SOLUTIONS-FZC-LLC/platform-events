# Reusable workflow — called by ci.yml and release.yml as a job named "Validate".
# Fans out into two nested reusable-workflow calls, producing two required status
# checks (per the org's protect-main-branch ruleset):
#   "Validate / Quality / quality"  <- quality.yml
#   "Validate / Test / test"        <- test.yml
# (GitHub names a reusable-workflow-call check as "<calling job> / <called job>" at each
# level of nesting — this file is the middle level.)
name: Validate

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    secrets:
      GO_PRIVATE_TOKEN:
        description: 'Token for downloading private BCBP-SOLUTIONS-FZC-LLC Go modules'
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.ref }}
    # Explicit forwarding, not `secrets: inherit` — this job's own secrets context
    # only ever contains what ci.yml/release.yml passed to *this* (validate.yml)
    # workflow_call, so forward that value by name rather than relying on a second
    # level of `inherit` to reach across two hops.
    secrets:
      GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref }}
    secrets:
      GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
