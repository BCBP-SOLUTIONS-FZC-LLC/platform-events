name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: validate
    env:
      GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
      GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: make cover

      - name: Check coverage threshold (≥ 95%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 95" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below the 95% threshold"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    env:
      GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
      GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Verify binary is executable
        run: test -x bin/platform-events
