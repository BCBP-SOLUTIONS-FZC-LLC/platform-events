# Reusable workflow — called by validate.yml's "Test" job. Its job id ("test") combines
# with the calling chain to produce the "Validate / Test / test" required status check.
#
# Runs the full suite (unit + integration) with the race detector in one `make test-ci`
# invocation — integration tests spin up real LocalStack (SNS/SQS) and Postgres containers
# via testcontainers, which need Docker. GitHub-hosted ubuntu runners have Docker
# pre-installed, so no extra setup step is required.
name: Test Check

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    secrets:
      GO_PRIVATE_TOKEN:
        description: 'Token for downloading private BCBP-SOLUTIONS-FZC-LLC Go modules'
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Clean up credentials
        if: always()
        run: rm -f ~/.git-credentials

      - name: Test (race detector)
        run: make test-ci
