# platform-events — reference Prometheus rules for services using the
# library (load alongside the service's own rules).
#
# Enterprise Platform Observability Standard. platform-events emits ONLY the
# Tier 1 platform_* metrics; the pre-standard events_* / outbox_* / sqs_*
# names were removed without a compatibility period (no release emitting them
# was ever deployed), so every rule below queries a platform_* metric.
#   - platform_events.recording / platform_events.alerts use the Canonical
#     Tier 1 consumer metrics (platform_messages_received/processed/failed_total,
#     platform_dlq_messages_total).
#   - platform_events.proposed.recording / platform_events.proposed.alerts
#     cover the producer, outbox and SQS-client signals. Their metrics are
#     still Proposed (see docs/observability/metrics-registry.md) and await
#     governance ratification; with the legacy metrics gone they are the only
#     source for these signals. Every alert there carries
#     metric_status: proposed so it can be routed (e.g. not paged) until the
#     registry marks the metric Canonical — then move the rule to the
#     Canonical groups and drop the label.
#   CI enforces the split (test/unit/metrics/rules_test.go): a rule that
#   depends on a Proposed metric must live in a *.proposed group, and a
#   *.proposed group may hold only such rules. promtool validates syntax and
#   the alert unit tests (make rules-check).
#
# platform_retry_total is Canonical but deliberately not alerted on, and
# platform_dependency_request_seconds (PlatformEventsSQSReceiveFailing) is
# disabled in the same services: IAM services register both names with
# conflicting label sets, so platform-events' collector is refused
# (RegistrationWarning) and an alert on it would never fire there.
#
# Label note: every metric carries {domain, service, environment} plus its
# approved labels; queue is the queue NAME and topic the topic NAME (never a
# URL or ARN). Aggregations keep {domain, service, environment} (and queue /
# topic where meaningful) so dashboards join cleanly.
#
# Counter note: increase() over a series that first appears at 1 returns 0,
# so the first event after a restart would be missed. platform-events
# pre-creates every counter whose labels are known up front at 0 — per queue
# when a consumer starts; platform_outbox_errors_total per operation and
# platform_telemetry_label_overflow_total{label="event_type"} at init.
# Counters keyed by event_type (platform_dlq_messages_total) cannot be, so
# their rules add the value of series with no sample in the hour before the
# window (`x unless last_over_time(x[1h] offset 15m)`).

groups:
  - name: platform_events.recording
    interval: 30s
    rules:
      # ── Consumer SLIs (Canonical Tier 1) ──────────────────────────────
      - record: platform_events:messages_received:rate5m
        expr: sum by (domain, service, environment, queue) (rate(platform_messages_received_total[5m]))

      - record: platform_events:messages_received:rate1h
        expr: sum by (domain, service, environment, queue) (rate(platform_messages_received_total[1h]))

      - record: platform_events:messages_failure_ratio:rate5m
        expr: |
          sum by (domain, service, environment, queue) (rate(platform_messages_failed_total[5m]))
            /
          sum by (domain, service, environment, queue) (rate(platform_messages_received_total[5m]))

      - record: platform_events:messages_failure_ratio:rate1h
        expr: |
          sum by (domain, service, environment, queue) (rate(platform_messages_failed_total[1h]))
            /
          sum by (domain, service, environment, queue) (rate(platform_messages_received_total[1h]))

      - record: platform_events:messages_success_ratio:rate5m
        expr: |
          sum by (domain, service, environment, queue) (rate(platform_messages_processed_total[5m]))
            /
          sum by (domain, service, environment, queue) (rate(platform_messages_received_total[5m]))

      # A series born in the window (the first dead-letter of an event_type /
      # reason since the pod started) counts its whole value; increase() alone
      # would report 0 for it. "Born" means no sample in the hour before the
      # window, so a scrape gap of a few minutes does not re-count old values.
      - record: platform_events:dlq_messages:increase15m
        expr: |
          sum by (domain, service, environment, operation, reason) (
            (platform_dlq_messages_total unless last_over_time(platform_dlq_messages_total[1h] offset 15m))
              or
            increase(platform_dlq_messages_total[15m])
          )

  - name: platform_events.alerts
    rules:
      # SLO: 99.9% of received messages are processed without failure
      # (error budget 0.1%). Fast burn: 14.4× budget over 1h and 5m
      # (2% of a 30-day budget in 1 hour) — Google SRE multi-window pattern.
      # Minimum-traffic guard: below 1 message/minute a single failure is
      # already a large ratio, so a quiet queue would page on noise.
      - alert: PlatformEventsConsumerErrorBudgetBurn
        expr: |
          platform_events:messages_failure_ratio:rate1h > (14.4 * 0.001)
            and
          platform_events:messages_failure_ratio:rate5m > (14.4 * 0.001)
            and
          platform_events:messages_received:rate1h > (1 / 60)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is failing messages on {{ $labels.queue }} fast enough to exhaust its monthly error budget"
          description: "Over 1.44% of messages received on {{ $labels.queue }} failed in both the last hour and the last 5 minutes."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsconsumererrorbudgetburn"

      # Dead-lettering is progress too (a handler that SendToDLQs and returns
      # nil is not "processed"). platform_dlq_messages_total has no queue
      # label, so a queue that processes nothing alerts unless the service's
      # whole consume dead-letter rate covers at least 90% of what that queue
      # receives — dead-lettering on one queue cannot hide a stall on another
      # that receives more.
      - alert: PlatformEventsConsumerStalled
        expr: |
          (
            sum by (domain, service, environment, queue) (rate(platform_messages_received_total[10m])) > 0
              unless
            sum by (domain, service, environment, queue) (rate(platform_messages_processed_total[10m])) > 0
          )
            > on (domain, service, environment) group_left ()
          (
            1.1 * sum by (domain, service, environment) (rate(platform_dlq_messages_total{operation="consume"}[10m]))
              or
            0 * sum by (domain, service, environment) (rate(platform_messages_received_total[10m]))
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} receives messages on {{ $labels.queue }} but processes none"
          description: "Messages have been delivered for about 25 minutes (a 10-minute window held for 15 minutes) without a single successful handler completion."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsconsumerstalled"

      - alert: PlatformEventsMalformedMessages
        expr: sum by (domain, service, environment, queue) (increase(platform_messages_failed_total{reason="malformed"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} received malformed messages on {{ $labels.queue }}"
          description: "Messages that are not valid event envelopes arrived in the last 15 minutes — a producer or subscription is misconfigured."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsmalformedmessages"

      # reason="explicit" is excluded: a handler dead-lettering on purpose
      # (SendToDLQ, then nil) is expected behaviour, not an incident.
      - alert: PlatformEventsMessagesDeadLettered
        expr: platform_events:dlq_messages:increase15m{reason!="explicit"} > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} dead-lettered messages ({{ $labels.operation }}, {{ $labels.reason }})"
          description: "Messages were moved to dead-letter storage in the last 15 minutes and need investigation or replay."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsmessagesdeadlettered"

  # ── Proposed Tier 1 (producer / outbox / SQS client) ─────────────────────
  # These metrics await governance ratification (Status: Proposed). Rules
  # here are the reference signals for these paths, but every alert carries
  # metric_status: proposed — route accordingly until ratified.
  - name: platform_events.proposed.recording
    interval: 30s
    rules:
      - record: platform_events:publish_error_ratio:rate5m
        expr: |
          sum by (domain, service, environment, topic) (rate(platform_messages_published_total{outcome="error"}[5m]))
            /
          sum by (domain, service, environment, topic) (rate(platform_messages_published_total[5m]))

      # Every runner reads the same outbox table: max, not sum.
      - record: platform_events:outbox_pending:max
        expr: max by (domain, service, environment) (platform_outbox_pending_events)

      - record: platform_events:outbox_publish_error_ratio:rate5m
        expr: |
          sum by (domain, service, environment) (rate(platform_outbox_publish_attempts_total{outcome="error"}[5m]))
            /
          sum by (domain, service, environment) (rate(platform_outbox_publish_attempts_total[5m]))

  - name: platform_events.proposed.alerts
    rules:
      - alert: PlatformEventsPublishErrors
        expr: platform_events:publish_error_ratio:rate5m > 0.05
        for: 10m
        labels:
          severity: warning
          metric_status: proposed
        annotations:
          summary: "{{ $labels.service }} fails over 5% of publishes to {{ $labels.topic }}"
          description: "More than 5% of publishes have failed for 10 minutes."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventspublisherrors"

      - alert: PlatformEventsOutboxBacklog
        expr: platform_events:outbox_pending:max > 1000
        for: 15m
        labels:
          severity: warning
          metric_status: proposed
        annotations:
          summary: "{{ $labels.service }} has over 1000 unpublished outbox events"
          description: "The transactional outbox backlog has stayed above 1000 events for 15 minutes; event delivery is lagging."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsoutboxbacklog"

      # The pending gauge keeps its last value when the count query fails; the
      # failure is counted in platform_outbox_errors_total{operation="pending_count"}.
      - alert: PlatformEventsOutboxPendingUnknown
        expr: sum by (domain, service, environment) (rate(platform_outbox_errors_total{operation="pending_count"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          metric_status: proposed
        annotations:
          summary: "{{ $labels.service }} cannot read its outbox backlog"
          description: "The outbox pending-count query has been failing for 10 minutes; platform_outbox_pending_events is frozen at its last value, so the backlog alert is blind."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsoutboxpendingunknown"

      # Delivery stopped although the backlog is small (transient failures —
      # e.g. broken credentials — never dead-letter, so nothing else fires on a
      # low-volume service). Not enabled in the reference rules yet:
      # - alert: PlatformEventsOutboxDeliveryStalled
      #   expr: max by (domain, service, environment) (platform_outbox_oldest_pending_age) > 600
      #   for: 10m
      #   labels: {severity: critical, metric_status: proposed}
      #   (triage: docs/observability/README.md § Outbox delivery-stall signal)

      - alert: PlatformEventsOutboxPollFailing
        expr: sum by (domain, service, environment) (rate(platform_outbox_errors_total{operation="poll"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          metric_status: proposed
        annotations:
          summary: "{{ $labels.service }}'s outbox runner cannot claim events"
          description: "Outbox poll cycles have kept failing for 10 minutes (at least one failure in every 5-minute window); outbox events may not be delivered."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsoutboxpollfailing"

      - alert: PlatformEventsOutboxDuplicateDeliveryRisk
        expr: sum by (domain, service, environment) (increase(platform_outbox_errors_total{operation="mark_published"}[15m])) > 0
        labels:
          severity: warning
          metric_status: proposed
        annotations:
          summary: "{{ $labels.service }} published outbox events it could not mark as published"
          description: "Those events will be delivered again; consumers must be idempotent (inbox dedup)."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventsoutboxduplicatedeliveryrisk"

      # platform_dependency_request_seconds has no queue label: the alert is per
      # service, and the runbook shows how to find the queue from the logs.
      - alert: PlatformEventsSQSReceiveFailing
        expr: sum by (domain, service, environment) (rate(platform_dependency_request_seconds_count{dependency="sqs",operation="receive_message",outcome="error"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          metric_status: proposed
        annotations:
          summary: "{{ $labels.service }} cannot receive from SQS"
          description: "ReceiveMessage has been failing for 10 minutes (credentials, IAM, network or a deleted queue)."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventssqsreceivefailing"

      - alert: PlatformEventsEventTypeLabelOverflow
        expr: sum by (domain, service, environment, label) (increase(platform_telemetry_label_overflow_total[1h])) > 0
        labels:
          severity: info
          metric_status: proposed
        annotations:
          summary: "{{ $labels.service }} replaced {{ $labels.label }} values that exceeded their cardinality bound"
          description: "A producer sends event types over 128 bytes (recorded as __oversized__) or more distinct event types than the per-process limit (recorded as __other__)."
          runbook_url: "https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-events/blob/main/docs/observability/runbook.md#platformeventseventtypelabeloverflow"
