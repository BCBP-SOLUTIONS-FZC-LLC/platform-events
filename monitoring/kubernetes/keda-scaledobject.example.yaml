# platform-events — reference autoscaling (KEDA) for a service using the
# library. Copy and adapt; this repository deploys nothing.
#
# Enterprise Platform Observability Standard ("migrate HPA references"):
# platform-events emits only Tier 1 platform_* metrics, so the outbox trigger
# scales on platform_outbox_pending_events. That metric is still Proposed —
# it awaits governance ratification — so the manifest declares it with the
# observability.platform/metric-status annotation below; CI requires the
# annotation on any manifest whose live query uses a Proposed metric
# (test/unit/metrics/monitoring_test.go). Drop it once the registry marks the
# metric Canonical.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orders-service
  annotations:
    observability.platform/metric-status: proposed # platform_outbox_pending_events awaits ratification
spec:
  scaleTargetRef:
    name: orders-service # the Deployment running the consumer / outbox runner
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    # 1. Outbox backlog: scale out when unpublished outbox events pile up.
    #    Runners use SELECT … FOR UPDATE SKIP LOCKED, so replicas share the
    #    backlog without contention.
    #    The gauge is capped at 100000. A failed count query leaves it at its
    #    last value (counted in platform_outbox_errors_total{operation="pending_count"},
    #    which PlatformEventsOutboxPendingUnknown alerts on), so a briefly
    #    failing count — typically under heavy load — never reads as an empty
    #    backlog. max across replicas: every runner reads the same table. With
    #    no series at all (no runner scraped) the query returns nothing;
    #    ignoreNullValues: "false" makes KEDA treat that as an error (holding
    #    the current replica count, with fallback if configured) instead of as
    #    0, which would scale in.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        # max_over_time smooths the scaling signal over 10 minutes; environment
        # keeps a staging backlog out of prod's scaling decision.
        query: max by (domain, service, environment) (max_over_time(platform_outbox_pending_events{domain="billing",service="orders-service",environment="prod"}[10m:30s]))
        threshold: "500"
        ignoreNullValues: "false"

    # 2. Queue backlog: KEDA's native SQS scaler reads the queue attributes
    #    directly (IRSA needs sqs:GetQueueAttributes), so it needs no metric.
    #    Alternative (Proposed, opt-in via WithQueueDepthMetrics):
    #    max(platform_queue_depth{domain="billing",service="orders-service",environment="prod",queue="orders"})
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-irsa
      metadata:
        queueURL: https://sqs.eu-west-1.amazonaws.com/123456789012/orders
        queueLength: "100" # target messages per replica
        awsRegion: eu-west-1
