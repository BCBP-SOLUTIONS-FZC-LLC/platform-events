version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - gosec
    - errorlint
    - exhaustive
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
        - fmt.Println
        - fmt.Print
    gosec:
      excludes:
        - G115 # integer overflow on conversion — acceptable in internal helpers
        - G404 # weak random — acceptable for jitter, not security-sensitive
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/BCBP-SOLUTIONS-FZC-LLC

issues:
  exclude-dirs:
    - test/smoke
