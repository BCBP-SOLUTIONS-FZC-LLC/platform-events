version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - gosec
    - errorlint
    - exhaustive
    - depguard
  settings:
    depguard:
      rules:
        # Every database connection, configuration and operation goes
        # through platform-pgcommon (Pool, RunInTx, ConfigFromEnv and its
        # Tx/TxOptions/Conn/Rows/Row/ErrNoRows aliases). Tests may still use
        # pgx directly, e.g. to fake the full pgx.Tx interface.
        pgcommon-only:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx
              desc: use platform-pgcommon (pgcommon.Tx, pgcommon.RunInTx, pgcommon.Conn, pgcommon.ErrNoRows, …) instead of pgx directly
            - pkg: database/sql
              desc: use platform-pgcommon's Pool instead of database/sql
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
        - fmt.Println
        - fmt.Print
    gosec:
      excludes:
        - G115 # integer overflow on conversion — acceptable in internal helpers
        - G404 # weak random — acceptable for jitter, not security-sensitive
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/BCBP-SOLUTIONS-FZC-LLC

issues:
  exclude-dirs:
    - test/smoke
